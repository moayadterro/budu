name: budu

# Base-ground stack. Everything that CAN run in a container does.
# BigBlueButton is the exception (see the note at the bottom).
#
#   cp .env.example .env   &&   docker compose up --build
#   frontend → http://localhost:3000     IOMAD → http://localhost:8080

services:
  # ---- App database (for the Next.js frontend's own data) ----
  app-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${APP_DB_NAME:?set in .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/; mount the parent
      - app-db-data-18:/var/lib/postgresql
    ports:
      - '5432:5432'

  # ---- Frontend (Next.js + Tailwind) ----
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_IOMAD_URL: ${IOMAD_URL:-http://localhost:8080}
      # server-side only: IOMAD as seen from inside the compose network
      IOMAD_API_URL: http://iomad
      IOMAD_WS_TOKEN: ${IOMAD_WS_TOKEN:-}
      # links in emails, and where email goes: the real SMTP mailbox from .env (Timeweb today)
      APP_URL: ${APP_URL:-http://localhost:3000}
      MAIL_FROM: ${MAIL_FROM:?set in .env}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}   # where the public Contact form sends (empty = only stored)
      SMTP_HOST: ${SMTP_HOST:?set in .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?set in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set in .env}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      NEXT_PUBLIC_BBB_URL: ${BBB_URL:-}
      UPLOAD_DIR: /uploads
      DATABASE_URL: postgres://${APP_DB_USER:?set in .env}:${APP_DB_PASSWORD:?set in .env}@app-db:5432/${APP_DB_NAME:?set in .env}
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app          # live reload in dev
      - /app/node_modules        # keep the image's node_modules
      - upload-chunks:/uploads   # resumable uploads in progress (tus); finished files go to IOMAD
    depends_on:
      - app-db

  # ---- IOMAD (multi-tenant Moodle: tenants, users, courses, enrolment, gradebook) ----
  iomad-db:
    image: mariadb:11.8.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${IOMAD_DB_NAME:?set in .env}
      MARIADB_USER: ${IOMAD_DB_USER:?set in .env}
      MARIADB_PASSWORD: ${IOMAD_DB_PASSWORD:?set in .env}
      MARIADB_ROOT_PASSWORD: ${IOMAD_DB_ROOT_PASSWORD:?set in .env}
      MARIADB_AUTO_UPGRADE: '1'   # upgrade system tables when the MariaDB version changes
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      retries: 30
    volumes:
      - iomad-db-data:/var/lib/mysql

  iomad:
    build: ./iomad
    restart: unless-stopped
    environment:
      IOMAD_URL: ${IOMAD_URL:-http://localhost:8080}
      IOMAD_DB_HOST: iomad-db
      IOMAD_DB_NAME: ${IOMAD_DB_NAME:?set in .env}
      IOMAD_DB_USER: ${IOMAD_DB_USER:?set in .env}
      IOMAD_DB_PASSWORD: ${IOMAD_DB_PASSWORD:?set in .env}
      IOMAD_ADMIN_USER: ${IOMAD_ADMIN_USER:?set in .env}
      IOMAD_ADMIN_PASSWORD: ${IOMAD_ADMIN_PASSWORD:?set in .env}
      IOMAD_ADMIN_EMAIL: ${IOMAD_ADMIN_EMAIL:?set in .env}
    ports:
      - '${IOMAD_PORT:-8080}:80'
    volumes:
      - iomad-moodledata:/var/www/moodledata
    depends_on:
      iomad-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # BigBlueButton (live classes) is intentionally NOT here.
  # BBB is a multi-component stack its maintainers support only via the official
  # `bbb-install` script on a dedicated Ubuntu 22.04 host: it needs a public
  # FQDN + TLS, a wide UDP media port range, and TURN/coturn. It will not run as
  # a simple service inside this compose file. Provision it on its own server,
  # then point BBB_URL / BBB_SECRET (in .env) at it; the frontend and IOMAD
  # talk to it over its API. See README.md and:
  #   https://docs.bigbluebutton.org/administration/install/
  # ---------------------------------------------------------------------------

volumes:
  app-db-data:      # Postgres 16 data — kept only for rollback after the 18 upgrade; delete when happy
  app-db-data-18:
  iomad-db-data:
  iomad-moodledata:
  upload-chunks:    # unfinished resumable uploads (removed after a day)
